[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-seq-risk"
version = "0.1.0"
description = "Credit-risk machine learning engineering and sequence-model evaluation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "torch>=2.2",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "mlflow>=3.0",
    "pyspark>=3.5",
    "python-calamine>=0.2",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
